<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restablecer Contraseña</title>
  <link rel="stylesheet" href="css/rest_cont.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />

    <link rel="icon" href="Imagenes/Logos/favicon2.png" type="Imagenes/Logos/favicon2.png" />

    
</head>
<body>

  <!-- ENCABEZADO IGUAL QUE EL LOGIN -->
  <div class="barra-completa">
    <div class="logo-container">
      <img src="Imagenes/Logos/logo.png" alt="Logo Secretaría de Cultura" class="logo-login" />
    </div>
    <div class="barra-roja">
      <div class="textos-header">
        <h1 class="titulo">Secretaría de Cultura</h1>
        <h2 class="subtitulo">Sistema de Gestión de Acervos</h2>
      </div>
      <div class="caja-fecha">
        <span class="fecha-actual" id="fechaActual"></span>
      </div>
    </div>
  </div>

  <!-- ZONA DE FORMULARIO -->
  <div class="zona-login">
    <div class="login-container">
      <h2>Restablecer Contraseña</h2>
      <form id="reset-form">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com" />
        
        <button type="submit" class="mt-3">Restablecer</button>
      </form>

      <!-- Mensaje dinámico -->
      <div id="mensaje-envio" class="mt-3 text-success" style="display:none;"></div>

      <div class="mt-3">
        <a href="login.html">← Volver a iniciar sesión</a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="main-footer">
  <div class="footer-content">
    <img src="Imagenes/Logos/LC_P.png" alt="Logo de Secretaría de Cultura" class="footer-logo">

    <p class="footer-text">
      Todos los derechos reservados. | En desarrollo por Axel Cerecedo 👨🏻‍💻
    </p>

    
  </div>
</footer>

  <script src="js/rest_cont.js"></script>
  <script>
    const fecha = new Date().toLocaleDateString('es-MX', {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
    document.getElementById("fechaActual").textContent = fecha;

    // Mostrar mensaje tras enviar el formulario
    document.getElementById('reset-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const mensajeDiv = document.getElementById('mensaje-envio');
      mensajeDiv.style.display = 'none';
      
      const email = document.getElementById('email').value.trim();
      if (!email) {
        alert('Por favor, ingresa un correo válido.');
        return;
      }

      try {
        const response = await fetch('http://172.17.175.137:3000/solicitar-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (response.ok) {
          mensajeDiv.textContent = 'Se ha enviado un correo para restablecer la contraseña. Revisa tu bandeja de entrada.';
          mensajeDiv.style.display = 'block';
        } else {
          alert(data.message || 'Error al solicitar restablecimiento.');
        }
      } catch (error) {
        alert('Ocurrió un error en la solicitud.');
      }
    });
  </script>
</body>
</html>
