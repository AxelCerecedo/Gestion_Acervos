<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer Contraseña - Secretaría de Cultura</title>
  <link rel="stylesheet" href="css/login.css" />

    <link rel="icon" href="Imagenes/Logos/favicon2.png" type="Imagenes/Logos/favicon2.png" />

    
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="barra-completa">
    <div class="logo-container">
     <img src="Imagenes/Logos/logo.png" alt="Logo Secretaría de Cultura" class="logo-login" />
    </div>
    <div class="barra-roja">
      <div class="textos-header">
        <h1 class="titulo">Secretaría de Cultura</h1>
        <h3 class="subtitulo">Sistema Gestor de Acervos</h3>
      </div>
      <div class="caja-fecha">
        <div class="fecha-actual" id="fecha"></div>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="zona-login">
    <!-- Eliminamos el slider para centrar solo el formulario -->
    <div class="login-container">
      <h2>Restablecer Contraseña</h2>
      <form id="resetPasswordForm">
        <label for="nuevaContrasena">Nueva contraseña:</label>
        <input type="password" id="nuevaContrasena" name="nuevaContrasena" required minlength="6" />
        <button type="submit">Actualizar contraseña</button>
        <div id="message" style="margin-top: 10px; min-height: 18px; color: red;"></div>
      </form>
    </div>
  </main>

  <!-- FOOTER -->
 <footer class="main-footer">
  <div class="footer-content">
    <!-- <img src="Imagenes/Logos/LC_P.png" alt="Logo de Secretaría de Cultura" class="footer-logo"> -->
    <img src="Imagenes/Logos/favicon.png" alt="Logo de SGA" class="footer-logo footer-logo-right">
    <p class="footer-text">
      Todos los derechos reservados. | En desarrollo por Axel Cerecedo 👨🏻‍💻
    </p>
  </div>
</footer>

  <!-- Fecha en español -->
  <script>
    const fecha = new Date();
    const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('fecha').textContent = fecha.toLocaleDateString('es-MX', opciones);
  </script>

  <script>
    // Obtener token de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const form = document.getElementById('resetPasswordForm');
    const nuevaContrasenaInput = document.getElementById('nuevaContrasena');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nuevaContrasena = nuevaContrasenaInput.value.trim();
      if (nuevaContrasena.length < 6) {
        messageDiv.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        return;
      }

      try {
        const response = await fetch('http://172.17.175.137:3000/confirmar-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, nuevaContrasena })
        });

        const data = await response.json();

        if (!response.ok) {
          messageDiv.textContent = data.message || 'Error al actualizar la contraseña.';
          return;
        }

        messageDiv.style.color = 'green';
        messageDiv.textContent = data.message || 'Contraseña actualizada con éxito.';

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (error) {
        messageDiv.textContent = 'Error de conexión con el servidor.';
        console.error(error);
      }
    });
  </script>
</body>
</html>
